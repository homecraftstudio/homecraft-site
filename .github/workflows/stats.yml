# Every 15 minutes: a snapshot of the visitor counters for homecraft.studio/stats, on the branch stats-data
# (one commit, replaced each time), so the stats page shows the numbers at once.
name: Statistiek bijwerken
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  verzamel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vorige stand ophalen
        run: git fetch --depth 1 origin stats-data && git show FETCH_HEAD:data.json > /tmp/vorig.json || echo '{}' > /tmp/vorig.json
      - name: Tellers lezen
        run: node .github/scripts/stats-verzamel.mjs /tmp/vorig.json /tmp/data.json
      - name: Stand opslaan op stats-data
        run: |
          mkdir /tmp/uit && cp /tmp/data.json /tmp/uit/data.json && cd /tmp/uit
          git init -q -b stats-data
          git config user.name "homecraftstudio"
          git config user.email "65835301+homecraftstudio@users.noreply.github.com"
          git add data.json && git commit -q -m "Statistiek $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stats-data
